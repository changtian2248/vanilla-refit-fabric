# Gradle 运行参数（手机/PRoot 环境保守取值，避免 OOM）
org.gradle.jvmargs=-Xmx2560M -XX:+UseParallelGC
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.configuration-cache=false

# Fabric 工具链（与 Minecraft 版本无关的依赖）
loom_version=1.17.21
loader_version=0.19.3

# Minecraft 1.21.1 / Fabric
minecraft_version=1.21.1
fabric_api_version=0.116.17+1.21.1

# MixinExtras（@WrapOperation / @ModifyReturnValue / @Local 需要）
mixinextras_version=0.5.5

# 本模组
mod_version=1.0.1
maven_group=com.btsdhz.vanillarefit
archives_base_name=btsdhz_original-1.21.1
